<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standardizer Application</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--Toast Notification when mapping will be saved-->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div
        id="saveToast"
        class="toast align-items-center text-bg-success border-0"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body">
            <i class="fas fa-check-circle me-2"></i>
            <span id="toastMsg">Mappings saved!</span>
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <!--Navbar -->
    <nav class="navbar navbar-expand-lg bg-light fw-bold border-bottom">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <span class="brand-icon">⚡</span>
          <span class="fw-bold ms-2">Standardizer</span>
        </a>

        <div class="navbar-nav mx-auto">
          <a class="nav-link active fw-bold" href="#">CoA</a>
          <a class="nav-link" href="#">Journal</a>
          <a class="nav-link" href="#">Admin</a>
        </div>

        <div class="d-flex align-items-center gap-3">
          <span class="text-muted small">Standardizer Test</span>
          <button class="btn btn-link text-muted">
            <i class="fas fa-bell"></i>
          </button>
          <img
            src="https://ui-avatars.com/api/?name=Admin&background=3b82f6&color=fff"
            class="rounded-circle"
            width="36"
            height="36"
            alt="Admin"
          />
          <div>
            <button class="btn btn-danger btn-sm rounded" id="logoutBtn">
              <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="bg-white border-bottom py-2 px-4">
      <div
        class="d-flex flex-wrap gap-2 align-items-center justify-content-between"
      >
        <div class="d-flex flex-wrap gap-2" id="typeNavbar">
          <span class="text-muted small" id="typeLoading">Loading...</span>
        </div>

        <!--Submit and clear data-->
        <div class="d-flex gap-2 flex-shrink-0">
          <button class="btn btn-sm btn-success submit-btn">
            <i class="fas fa-save me-1"></i>Submit
          </button>
          <button class="btn btn-sm btn-danger" id="clearDataBtn">
            <i class="fas fa-trash-alt me-1"></i>Clear Data
          </button>
        </div>
      </div>
    </div>

    <!--Account lists Content -->
    <div class="container-fluid p-4">
      <div class="row g-3">
        <!--Source and mapping -->
        <div class="col-lg-8">
          <div class="card shadow-sm h-100">
            <div
              class="card-header justify-content-center bg-secondary-subtle fs-5 text-dark"
            >
              <strong
                >Source Account Structure | Likely Destination Account</strong
              >
            </div>

            <!-- Mapping Headers -->
            <div class="mapping-headers">
              <div class="bg-primary fw-bold fs-6 text-white p-2 rounded small">
                Balance Sheet Accounts
              </div>
              <div class="map-headers">
                <div class="header-ml fw-bold fs-6">Most Likely</div>
                <div class="header-l fw-bold fs-6">Likely</div>
                <div class="header-p fw-bold fs-6">Possible</div>
              </div>
            </div>

            <!-- Source List and dropping area -->
            <div
              class="card-body p-0 overflow-auto"
              style="max-height: calc(100vh - 280px)"
            >
              <div id="sourceMappingList" class="p-3">
                <div class="text-center text-muted py-5">Loading...</div>
              </div>
            </div>
          </div>
        </div>

        <!--Destination area -->
        <div class="col-lg-4">
          <div class="card shadow-sm h-100">
            <div class="card-header fs-5 bg-secondary-subtle text-dark">
              <strong>Destination Account Structure</strong>
            </div>

            <!--Scroller -->
            <div class="bg-success fw-bold fs-6 text-white px-3 py-2 small">
              Balance Sheet Accounts
            </div>
            <div
              class="d-flex align-items-center gap-2 px-3 py-2 bg-light border-bottom"
            >
              <!-- Left Arrow -->
              <button
                class="btn btn-sm p-0 text-secondary"
                id="scrollLeft"
                style="
                  width: 28px;
                  height: 28px;
                  border: none;
                  background: transparent;
                "
              >
                <i class="fas fa-chevron-left"></i>
              </button>

              <!-- Scrollable Container -->
              <div class="flex-grow-1 overflow-hidden position-relative">
                <div
                  class="d-flex gap-2 type-scroll"
                  id="destinationTypeScroller"
                >
                  <span class="text-muted small">Loading...</span>
                </div>
              </div>

              <!-- Right Arrow -->
              <button
                class="btn btn-sm p-0 text-secondary"
                id="scrollRight"
                style="
                  width: 28px;
                  height: 28px;
                  border: none;
                  background: transparent;
                "
              >
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>

            <!-- Search -->
            <div class="p-3 border-bottom">
              <input
                type="text"
                class="form-control form-control-sm"
                id="destinationSearch"
                placeholder="Search accounts..."
              />
            </div>

            <!-- Destination List -->
            <div
              class="card-body p-0 overflow-auto"
              style="max-height: calc(100vh - 340px)"
            >
              <div id="destinationAccountList" class="p-2">
                <div class="text-center text-muted py-5">Loading...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="data-loader.js"></script>
    <script src="ui-renderer.js"></script>
    <script src="drag-drop.js"></script>
    <script src="app.js"></script>
  </body>
</html>
