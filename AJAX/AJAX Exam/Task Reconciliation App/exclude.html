<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Excluded Transactions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="transactions.css">
</head>

<body>
<nav class="navbar navbar-light bg-light px-3 justify-content-between">
  <span class="navbar-brand fw-bold">Intercompany Transaction</span>
  <button class="btn btn-success" id="includeBtn" disabled>
    Move to Unreconciled
  </button>
</nav>

<div class="container-fluid mt-3">
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <a class="nav-link" href="index.html">Unreconciled</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="reconciled.html">Reconciled</a>
    </li>
    <li class="nav-item">
      <a class="nav-link active" href="exclude.html">Excluded</a>
    </li>
  </ul>

  <div class="row">
    <div class="col-md-6 border-end">
      <div class="bg-secondary text-white text-center py-2 fw-bold mb-2 rounded d-flex justify-content-between align-items-center px-3">
        <span>Company 1</span>
        <button class="btn btn-sm btn-light select-all-btn" data-company="Company1">
          Select All
        </button>
      </div>
      <div id="c1ExcludedColumn"></div>      
    </div>

    <div class="col-md-6">
      <div class="bg-secondary text-white text-center py-2 fw-bold mb-2 rounded d-flex justify-content-between align-items-center px-3">
        <span>Company 2</span>
        <button class="btn btn-sm btn-light select-all-btn" data-company="Company2">
          Select All
        </button>
      </div>
      <div id="c2ExcludedColumn"></div>      
    </div>
  </div>

  <div id="excludedContainer" style="display: none;"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="exclude.js"></script>
</body>
</html>
