<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Intercompany Transactions</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="transactions.css" />
  </head>

  <body>
    <nav class="navbar navbar-light bg-light px-3 justify-content-between">
      <span class="navbar-brand fw-bold">Intercompany Transaction</span>

      <div class="d-flex align-items-center gap-4">
        <div class="fw-bold">Credit: <span id="debit">0</span></div>
        <div class="fw-bold">Debit: <span id="credit">0</span></div>
        <button class="btn btn-success" id="reconcileBtn" disabled>
          Reconciliation
        </button>
        <button class="btn btn-warning" id="excludeBtn" disabled>
          Exclude
        </button>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>
    </nav>

    <div class="container-fluid mt-3">
      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">Unreconciled</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="reconciled.html">Reconciled</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="exclude.html">Exclude</a>
        </li>
      </ul>
      <!-- UNRECONCILED -->
      <div id="unreconciledTab">
        <div class="row fw-bold text-center mb-2">
          <div></div>
          <div
            class="bg-secondary text-white bg-secondary text-white p-2 col-md-4"
          >
            Company 1
          </div>
          <div
            class="bg-secondary text-white bg-secondary text-white p-2 col-md-4"
          >
            Drop Zone
          </div>
          <div
            class="bg-secondary text-white bg-secondary text-white p-2 col-md-4"
          >
            Company 2
          </div>
        </div>

        <div class="row">
          <div class="col-md-8" id="reconciliation-container"></div>
          <div class="col-md-4">
            <div id="company2" class="p-2 border rounded bg-white"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Global Loader -->
    <div id="globalLoader" class="loader-overlay d-none">
      <div
        class="spinner-border text-primary"
        role="status"
        style="width: 3rem; height: 3rem"
      >
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="transactions.js"></script>
  </body>
</html>
