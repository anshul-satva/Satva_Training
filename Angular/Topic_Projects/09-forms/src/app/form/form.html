<h2>Signal Reactive form</h2>
<form [formGroup]="form">
  <input formControlName="name" placeholder="Name" />
  <br /><br />
  <input formControlName="email" placeholder="Email" />
  <br /><br />
</form>

<button (click)="submitForm()">Submit</button>

<p>Signal Value: {{ userSignal() | json }}</p>
