<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Directory</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Mulish", sans-serif;
        font-size: 16px;
        background: #f0f2f5;
      }
      h2 {
        font-size: 22px;
        font-weight: 800;
      }
      th {
        font-size: 18px;
        font-family: "Mulish", sans-serif;
      }
      td {
        font-size: 16px;
        font-family: "Mulish", sans-serif;
      }

      .dept-Sales {
        color: #ff0000;
        font-weight: 700;
      }
      .dept-Marketing {
        color: #005400;
        font-weight: 700;
      }
      .dept-Development {
        color: #000000;
        font-weight: 700;
      }
      .dept-QA {
        color: #0000ff;
        font-weight: 700;
      }
      .dept-HR {
        color: #e65c00;
        font-weight: 700;
      }
      .dept-SEO {
        color: #fe00ef;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="bg-primary text-white py-3 px-4 shadow-sm mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h2 class="mb-0 text-white">
            <i class="bi bi-people-fill me-2"></i>Employee List
          </h2>
        </div>
        <span
          class="badge bg-white text-primary fs-6 px-3 py-2"
          id="totalCount"
        >
          Loading...
        </span>
      </div>
    </div>

    <div class="container-fluid px-4">
      <div class="row mb-3">
        <div class="col-md-4 ms-auto">
          <div class="input-group shadow-sm">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input
              type="text"
              id="searchInput"
              class="form-control border-start-0"
              placeholder="Search here..."
            />
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0" id="tableBody">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted">Loading employees...</p>
          </div>
        </div>

        <div
          class="card-footer bg-white d-flex justify-content-between align-items-center"
          id="paginationWrap"
          style="display: none !important"
        >
          <small class="text-muted fw-semibold" id="pageInfo"></small>
          <ul class="pagination pagination-sm mb-0" id="pageBtns"></ul>
        </div>
      </div>
    </div>

    <div class="modal fade" id="empModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-primary text-white">
            <h6 class="modal-title fw-bold fs-5">
              Employee Details
            </h6>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-4 " id="modalBody"></div>
          <div class="modal-footer">
            <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
